<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly dashboard</title>
  <style>
    :root { --bg: #f7f6f3; --card: #fff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #e2513a; --good: #2f7a4d; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
    .muted { color: var(--muted); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
    .kpi .label { font-size: 13px; color: var(--muted); }
    .kpi .value { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .kpi .delta { font-size: 13px; font-weight: 600; }
    .up { color: var(--good); } .down { color: var(--accent); }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-top: 12px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    h2 { margin: 0 0 16px; font-size: 15px; }
    .bars { display: flex; align-items: end; gap: 10px; height: 200px; padding-top: 8px; }
    .bar { flex: 1; background: var(--accent); border-radius: 6px 6px 2px 2px; position: relative; min-height: 4px; }
    .bar span { position: absolute; bottom: -22px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    td, th { padding: 8px 0; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    td:last-child, th:last-child { text-align: right; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Weekly dashboard</h1>
        <div class="muted">Week 42 · All stores</div>
      </div>
      <div class="muted">Updated today</div>
    </header>

    <section class="kpis" id="kpis"></section>

    <section class="grid">
      <div class="card">
        <h2>Revenue by day (₹ lakh)</h2>
        <div class="bars" id="bars"></div>
      </div>
      <div class="card">
        <h2>Top stores</h2>
        <table>
          <thead><tr><th>Store</th><th>Revenue</th></tr></thead>
          <tbody id="stores"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // Replace these numbers, or connect live data (Quire → Live Data) and fetch("data/…") instead.
    const kpis = [
      { label: "Revenue", value: "₹42.6 L", delta: +8.2 },
      { label: "Orders", value: "1,284", delta: +3.1 },
      { label: "Average order", value: "₹3,318", delta: +4.9 },
      { label: "Returns", value: "3.4%", delta: -0.6 },
    ];
    const days = [["Mon", 5.2], ["Tue", 5.9], ["Wed", 6.4], ["Thu", 5.7], ["Fri", 7.8], ["Sat", 6.9], ["Sun", 4.7]];
    const stores = [["Wadala", "₹9.8 L"], ["Sion", "₹8.1 L"], ["District 9", "₹7.4 L"], ["GS-2", "₹6.9 L"]];

    document.getElementById("kpis").innerHTML = kpis
      .map((k) => `<div class="card kpi"><div class="label">${k.label}</div><div class="value">${k.value}</div>
        <div class="delta ${k.delta >= 0 ? "up" : "down"}">${k.delta >= 0 ? "▲" : "▼"} ${Math.abs(k.delta)}% vs last week</div></div>`)
      .join("");
    const max = Math.max(...days.map((d) => d[1]));
    document.getElementById("bars").innerHTML = days
      .map(([d, v]) => `<div class="bar" style="height:${(v / max) * 100}%" title="${d}: ₹${v} L"><span>${d}</span></div>`)
      .join("");
    document.getElementById("stores").innerHTML = stores.map(([s, v]) => `<tr><td>${s}</td><td>${v}</td></tr>`).join("");
  </script>
</body>
</html>
