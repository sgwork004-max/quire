<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Launch one-pager</title>
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
    .hero { padding: 96px 48px 72px; background: linear-gradient(135deg, #1e1b4b, #4338ca); color: white; }
    .hero h1 { font-size: 56px; letter-spacing: -0.03em; margin: 0 0 12px; }
    .hero p { font-size: 20px; opacity: 0.8; max-width: 560px; margin: 0; }
    .cta { display: inline-block; margin-top: 28px; padding: 12px 22px; border-radius: 999px; background: white; color: #1e1b4b; font-weight: 600; text-decoration: none; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 48px; }
    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
    .card h3 { margin: 0 0 6px; }
    .card p { margin: 0; color: #475569; }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Ship reports people actually read</h1>
    <p>Turn your weekly numbers into a page your whole team opens.</p>
    <a class="cta" href="https://example.com">Get early access</a>
  </section>
  <section class="grid">
    <div class="card"><h3>Live data</h3><p>Connect a sheet and the page updates itself.</p></div>
    <div class="card"><h3>One link</h3><p>Share once. Everyone always sees the latest.</p></div>
    <div class="card"><h3>Comments</h3><p>Feedback right on the page, not in email threads.</p></div>
  </section>
</body>
</html>
